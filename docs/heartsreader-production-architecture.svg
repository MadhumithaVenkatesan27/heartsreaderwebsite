<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">HeartsReader Production Architecture</title>
  <desc id="desc">Layered production architecture diagram for HeartsReader showing frontend, security, backend, data storage, payment, email, and operations.</desc>
  <defs>
    <style>
      .bg { fill: #111217; }
      .layer { fill: #171a21; stroke: #343946; stroke-width: 2; stroke-dasharray: 8 8; rx: 20; }
      .title { fill: #f5efe6; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #aeb3c2; font: 400 18px Arial, sans-serif; }
      .layer-label { fill: #d8dbe6; font: 700 20px Arial, sans-serif; }
      .box { stroke-width: 2; rx: 12; }
      .box-title { fill: #ffffff; font: 700 20px Arial, sans-serif; text-anchor: middle; }
      .box-sub { fill: #d4d8e8; font: 400 14px Arial, sans-serif; text-anchor: middle; }
      .frontend { fill: #5546b8; stroke: #8173dc; }
      .security { fill: #08705f; stroke: #35aa96; }
      .backend { fill: #135d9a; stroke: #4aa3df; }
      .data { fill: #8b5207; stroke: #d59a33; }
      .external { fill: #8c3d22; stroke: #d07655; }
      .ops { fill: #55595e; stroke: #90959d; }
      .arrow { stroke: #8d93a3; stroke-width: 3; marker-end: url(#arrowhead); }
      .note { fill: #c9cdd8; font: 400 15px Arial, sans-serif; }
      .legend-text { fill: #cfd3df; font: 400 15px Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8d93a3" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text x="70" y="64" class="title">HeartsReader / Crossed Hearts Production Architecture</text>
  <text x="70" y="96" class="subtitle">MVP platform for accounts, payments, private PDFs, physical orders, subscriptions, and admin operations</text>

  <rect x="60" y="125" width="1280" height="112" class="layer"/>
  <text x="85" y="158" class="layer-label">1. Client Layer</text>
  <rect x="115" y="176" width="220" height="46" class="box frontend"/>
  <text x="225" y="204" class="box-title">Website</text>
  <text x="225" y="220" class="box-sub">heartsreader.com</text>
  <rect x="390" y="176" width="220" height="46" class="box frontend"/>
  <text x="500" y="204" class="box-title">Reader + Checkout</text>
  <text x="500" y="220" class="box-sub">Book pages, cart, PDFs</text>
  <rect x="665" y="176" width="220" height="46" class="box frontend"/>
  <text x="775" y="204" class="box-title">Admin Dashboard</text>
  <text x="775" y="220" class="box-sub">Orders, users, reports</text>
  <rect x="940" y="176" width="220" height="46" class="box frontend"/>
  <text x="1050" y="204" class="box-title">Static Assets</text>
  <text x="1050" y="220" class="box-sub">Images, CSS, JS</text>

  <line x1="700" y1="246" x2="700" y2="282" class="arrow"/>

  <rect x="60" y="285" width="1280" height="112" class="layer"/>
  <text x="85" y="318" class="layer-label">2. Security + API Entry Layer</text>
  <rect x="115" y="336" width="220" height="46" class="box security"/>
  <text x="225" y="364" class="box-title">CORS + HTTPS</text>
  <text x="225" y="380" class="box-sub">Trusted domains only</text>
  <rect x="390" y="336" width="220" height="46" class="box security"/>
  <text x="500" y="364" class="box-title">Rate Limiting</text>
  <text x="500" y="380" class="box-sub">Login, OTP, payments</text>
  <rect x="665" y="336" width="220" height="46" class="box security"/>
  <text x="775" y="364" class="box-title">JWT Auth</text>
  <text x="775" y="380" class="box-sub">User/admin protection</text>
  <rect x="940" y="336" width="220" height="46" class="box security"/>
  <text x="1050" y="364" class="box-title">Helmet + Logs</text>
  <text x="1050" y="380" class="box-sub">Safer headers/errors</text>

  <line x1="700" y1="406" x2="700" y2="442" class="arrow"/>

  <rect x="60" y="445" width="1280" height="112" class="layer"/>
  <text x="85" y="478" class="layer-label">3. Backend Application Layer — Node.js / Express on Render</text>
  <rect x="95" y="496" width="210" height="46" class="box backend"/>
  <text x="200" y="524" class="box-title">Auth APIs</text>
  <text x="200" y="540" class="box-sub">Register, login, OTP</text>
  <rect x="340" y="496" width="210" height="46" class="box backend"/>
  <text x="445" y="524" class="box-title">Library APIs</text>
  <text x="445" y="540" class="box-sub">Books, PDFs, access</text>
  <rect x="585" y="496" width="210" height="46" class="box backend"/>
  <text x="690" y="524" class="box-title">Order APIs</text>
  <text x="690" y="540" class="box-sub">Physical + digital</text>
  <rect x="830" y="496" width="210" height="46" class="box backend"/>
  <text x="935" y="524" class="box-title">Webhook APIs</text>
  <text x="935" y="540" class="box-sub">Razorpay / Stripe</text>
  <rect x="1075" y="496" width="210" height="46" class="box backend"/>
  <text x="1180" y="524" class="box-title">Admin APIs</text>
  <text x="1180" y="540" class="box-sub">Dashboard + reports</text>

  <line x1="700" y1="566" x2="700" y2="602" class="arrow"/>

  <rect x="60" y="605" width="1280" height="112" class="layer"/>
  <text x="85" y="638" class="layer-label">4. Data + File Storage Layer</text>
  <rect x="105" y="656" width="250" height="46" class="box data"/>
  <text x="230" y="684" class="box-title">MongoDB Atlas</text>
  <text x="230" y="700" class="box-sub">Users, books, orders, purchases</text>
  <rect x="420" y="656" width="250" height="46" class="box data"/>
  <text x="545" y="684" class="box-title">Cloudflare R2</text>
  <text x="545" y="700" class="box-sub">Private PDF + cover storage</text>
  <rect x="735" y="656" width="250" height="46" class="box data"/>
  <text x="860" y="684" class="box-title">Audit Logs</text>
  <text x="860" y="700" class="box-sub">Payments, admin, security</text>
  <rect x="1050" y="656" width="250" height="46" class="box data"/>
  <text x="1175" y="684" class="box-title">Backups</text>
  <text x="1175" y="700" class="box-sub">MongoDB recovery readiness</text>

  <line x1="700" y1="726" x2="700" y2="762" class="arrow"/>

  <rect x="60" y="765" width="1280" height="112" class="layer"/>
  <text x="85" y="798" class="layer-label">5. External Services</text>
  <rect x="115" y="816" width="220" height="46" class="box external"/>
  <text x="225" y="844" class="box-title">Razorpay</text>
  <text x="225" y="860" class="box-sub">India payments + UPI</text>
  <rect x="390" y="816" width="220" height="46" class="box external"/>
  <text x="500" y="844" class="box-title">Stripe</text>
  <text x="500" y="860" class="box-sub">International / future</text>
  <rect x="665" y="816" width="220" height="46" class="box external"/>
  <text x="775" y="844" class="box-title">Brevo Email</text>
  <text x="775" y="860" class="box-sub">OTP, reset, receipts</text>
  <rect x="940" y="816" width="220" height="46" class="box external"/>
  <text x="1050" y="844" class="box-title">Render Logs</text>
  <text x="1050" y="860" class="box-sub">Deploy + server monitoring</text>

  <text x="70" y="925" class="note">Current MVP status: core platform is built, but final production work remains: paid chapter unlock, payment edge-case testing, admin exports, email reliability, legal pages, performance, and final security audit.</text>
  <rect x="70" y="940" width="18" height="18" class="frontend"/><text x="98" y="955" class="legend-text">Frontend</text>
  <rect x="205" y="940" width="18" height="18" class="security"/><text x="233" y="955" class="legend-text">Security</text>
  <rect x="340" y="940" width="18" height="18" class="backend"/><text x="368" y="955" class="legend-text">Backend</text>
  <rect x="470" y="940" width="18" height="18" class="data"/><text x="498" y="955" class="legend-text">Data</text>
  <rect x="575" y="940" width="18" height="18" class="external"/><text x="603" y="955" class="legend-text">External services</text>
</svg>
