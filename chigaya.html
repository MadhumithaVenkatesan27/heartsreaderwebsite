              ? "$" + p
              : "$" + p.toFixed(2);

          String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;");
        const buyable = N.filter((n) => V[n].d && V[n].d.buy);
        const allTotal = buyable.reduce((s, n) => s + V[n].d.price, 0);

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

        function unlockBox() {
          const cards = buyable
            .map((n) => {
              const v = V[n],
                d = v.d;
              return `<div class="tp-un"><div class="tp-un-t">Volume ${n}</div>
              <div class="tp-un-s">${d.range}<br>${d.pre ? "Releases " + v.dd : "Available now"}</div>
              <div class="tp-un-p">${usd(d.price)}</div>
              <button data-act="addvol" data-n="${n}">${d.pre ? "Pre-Order" : "Add to Cart"}</button></div>`;
            })
            .join("");
          const all =
            buyable.length > 1
              ? `<div class="tp-un best"><div class="tp-un-t">Everything</div>
                <div class="tp-un-s">Volumes ${buyable[0]}–${buyable[buyable.length - 1]}<br>The whole series</div>
                <div class="tp-un-p">${usd(allTotal)}</div>
                <button data-act="addall">Add All to Cart</button></div>`
              : "";
          return `<section class="tp-box" id="tpUnlock"><div class="tp-box-h">Unlock options</div>
            <div class="tp-un-grid">${cards}${all}</div>
            <div class="tp-un-note">Or unlock single chapters for ${usd(V[N[0]].d.cp)} each in the chapter list below. Chapter 1 is always free.</div></section>`;
        }

        function cadenceBox() {
          const rows = N.map((n) => {
            const v = V[n];
            const when = v.d.pre
              ? `Digital ${v.dd} · Print ${v.pd}`
              : "Available now";
            return `<div><b>Volume ${n}</b><span>${when}</span></div>`;
          }).join("");
          return `<section class="tp-box tp-acc" id="tpCad">
            <button class="tp-row-btn" data-act="acc"><i class="ti ti-speakerphone" aria-hidden="true"></i><span>Release schedule</span><i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
            <div class="tp-acc-b">${rows}</div></section>`;
        }

        function chapterRows(n) {
          const v = V[n],
            d = v.d;
          if (!d.chapters) {
            return `<div class="tp-soon"><i class="ti ti-hourglass-high" aria-hidden="true"></i>
              <h4>Chapters coming soon</h4>
              <p>${d.pre ? "Pre-order the full volume now and read it when it releases on " + v.dd + "." : "Serialization has not started yet."}</p>
              <button class="tp-b pri" data-act="addvol" data-n="${n}">${d.pre ? "Pre-Order" : "Add to Cart"} · ${usd(d.price)}</button></div>`;
          }
          const idx = d.chapters.map((_, i) => i);
          if (!S.asc) idx.reverse();
          return idx
            .map((i) => {
              const t = d.chapters[i],
                num = i + 1;
              if (num === 1)
                return `<div class="tp-ep"><a class="tp-th" href="${d.read}"><img src="${v.cover}" alt="" loading="lazy"></a>
                <div class="tp-et"><small>Chapter ${num}</small><b>${t}</b><span class="tp-free">Free preview</span></div>
                <div class="tp-ea"><span class="tp-ep-p">Free</span><a class="tp-ep-b rd" href="${d.read}">▶ Read</a></div></div>`;
              return `<div class="tp-ep"><div class="tp-th lock"><img src="${v.cover}" alt="" loading="lazy"><i class="ti ti-lock" aria-hidden="true"></i></div>
              <div class="tp-et"><small>Chapter ${num}</small><b>${t}</b></div>
              <div class="tp-ea"><span class="tp-ep-p">${usd(d.cp)}</span><button class="tp-ep-b" data-act="buych" data-n="${n}" data-i="${i}">${C.chapterMode === "unlock" ? "Unlock" : "Add"}</button></div></div>`;

          const count = d.chapters
            ? d.chapters.length + " chapters"

            <div class="tp-eh"><h2 id="tpCount">${count}</h2>
              <button class="tp-sort" data-act="sort" aria-label="Reverse order"><span>${S.asc ? "Oldest first" : "Newest first"}</span><i class="ti ti-arrows-sort" aria-hidden="true"></i></button></div>
            <div class="tp-vols">${chips}</div>
            <div id="tpEpList">${chapterRows(S.vol)}</div></section>`;
        }

        function detailsBox() {
          const v = V[S.vol];
          const tog = N.map(
            (n) =>
              `<button class="${n === S.vol ? "on" : ""}" data-act="vol" data-n="${n}">Volume ${n}</button>`,
          ).join("");
          return `<section class="tp-box"><div class="tp-box-h">Details</div><div class="tp-box-b">
            <div class="tp-syn-tabs">${tog}</div>
            <p class="tp-syn">${v.syn}</p>
            ${C.humanTranslated ? '<div class="tp-trust"><i class="ti ti-language" aria-hidden="true"></i><span>100% human-translated — no AI/machine translation used</span></div>' : ""}
            <div class="tp-tags">${C.chips.map((c) => `<span class="tp-tag">${c}</span>`).join("")}</div>
            <div class="tp-kv"><span>Imprint</span><span>${C.imprint}</span></div>
            <div class="tp-kv"><span>Publisher</span><span>${C.publisher}</span></div>
            <div class="tp-kv"><span>Language</span><span>English</span></div>
            <div class="tp-kv"><span>Volume ${S.vol} status</span><span>${v.state}</span></div>
            <div class="tp-kv"><span>Pages</span><span>${v.pages}</span></div>
            <div class="tp-kv"><span>Translator</span><span>${v.translator}</span></div>
            <div class="tp-kv"><span>Volumes released</span><span>${C.released} of ${N.length}</span></div>
          </div></section>`;
        }

        function creatorsBox() {
          return (
            `<section class="tp-box"><div class="tp-box-h">${C.authors.length} Creators</div>` +
            C.authors
              .map(
                (a) =>
                  `<div class="tp-person"><div class="tp-av">${a[1].charAt(0)}</div><div><b>${a[1]}</b><small>${a[0]}</small></div></div>`,
              )
              .join("") +
            `</section>`
          );
        }

        function trailerBox() {
          if (!C.trailer) return "";
          return `<section class="tp-box"><div class="tp-box-h">Official trailer</div>
            <video class="tp-video" autoplay muted loop playsinline controls poster="${V[N[0]].cover}"><source src="${C.trailer}" type="video/mp4"></video></section>`;
        }

        function retailersBox() {
          const L = C.links || {};
          const row = (icon, name, url) =>
            url
              ? `<div class="tp-rt"><span><i class="ti ti-${icon}" aria-hidden="true"></i>${name}</span><a class="tp-get" href="${url}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener"' : ""}>Get</a></div>`
              : `<div class="tp-rt"><span><i class="ti ti-${icon}" aria-hidden="true"></i>${name}</span><span class="tp-sn">Coming soon</span></div>`;
          return (
            `<section class="tp-box"><div class="tp-box-h">Also available on</div>` +
            row("device-tablet", "Manga Plaza", L.mp) +
            row("brand-amazon", "Amazon Kindle", L.az) +
            row("brand-apple", "Apple Books", L.ap) +
            row("device-tablet", "Kobo", L.ko) +
            row("brand-google-play", "Google Play Books", L.gp) +
            row("book", "BookWalker", L.bw) +
            `</section>`
          );
        }

        function printBox() {
          const rows = [];
          N.forEach((n) => {
            const v = V[n],
              p = v.p;
            if (!p) return;
            const when = p.pre ? "Pre-order · " + v.pd : "Available now";
            rows.push(
              `<div class="tp-pe"><img src="${v.cover}" alt="Vol ${n} paperback" loading="lazy"><div><b>Paperback</b>Vol. ${n} · Standard · ${usd(p.std.price)}<br>${when}</div><a class="tp-get" href="${C.printPage}">View</a></div>`,
            );
            if (p.ltd)
              rows.push(
                `<div class="tp-pe"><img src="${p.ltd.cover || v.cover}" alt="Vol ${n} ${q(p.ltd.name)}" loading="lazy"><div><b>${p.ltd.name}</b>Vol. ${n} · Limited · ${usd(p.ltd.price)}<br>${when}</div><a class="tp-get" href="${C.printPage}">View</a></div>`,
              );
          });
          return `<section class="tp-box"><div class="tp-box-h">Print editions</div>${rows.join("")}</section>`;
        }

        function charsSection() {
          if (!C.characters || !C.characters.length) return "";
          return (
            `<section class="tp-chars"><h2>Characters</h2><div class="tp-char-row">` +
            C.characters
              .map(
                (c) =>
                  `<div class="tp-char"><div class="bg" style="background:${c.accent}"></div>${c.image ? `<img src="${c.image}" alt="${q(c.name)}" loading="lazy">` : ""}<div class="card"><b>${c.name}</b><span>${c.bio}</span></div></div>`,
              )
              .join("") +
            `</div></section>`
          );
        }

        function head() {
          return `<div class="tp-crumb"><a href="index.html">Home</a><span>›</span><a href="${C.crumb[1]}">${C.crumb[0]}</a><span>›</span><b>${C.name}</b></div>
          <div class="tp-banner"><img src="${C.banner}" alt="" onerror="this.remove()"></div>
          <div class="tp-headrow">
            <div class="tp-cover"><img id="tpCover" src="${V[S.vol].cover}" alt="${q(C.name)} cover"><span class="tp-fmt">Digital</span></div>
            <div class="tp-hi">
              <span class="tp-genre">${C.genreLabel}</span>
              <h1>${C.title}</h1>
              <div class="tp-meta"><span>Comic</span><span>·</span><span class="ok">● ${C.status}</span><span>·</span><span>${C.imprint}</span></div>
              <div class="tp-rate"><span class="st">☆☆☆☆☆</span>No ratings yet · 0 purchases</div>
              <div class="tp-cta">
                <a class="tp-b pri" href="${freeUrl}">Read Ch.1 for free</a>
                <button class="tp-b" data-act="jump">Unlock</button>
                <button class="tp-wish" id="wl-${C.id}" data-id="${C.id}" data-act="wish" aria-label="Add to wishlist">${HEART}</button>
              </div>
            </div>
          </div>
          <div class="tp-tabs" role="tablist"><button class="on" data-act="tab" data-t="eps">Chapters</button><button data-act="tab" data-t="info">Info</button></div>`;
        }

        function page() {
          return (
            head() +
            `<div class="tp-cols">
            <div class="tp-main">
              <section class="tp-box"><button class="tp-row-btn" data-act="login"><i class="ti ti-lock-open" aria-hidden="true"></i><span>Sign in to keep your unlocked chapters in your library</span><i class="ti ti-chevron-right" aria-hidden="true"></i></button></section>
              ${cadenceBox()}${unlockBox()}${episodesBox()}
            </div>
            <aside class="tp-side" id="tpSide">${sideHTML()}</aside>
          </div>${charsSection()}
          <div class="tp-bar"><a class="tp-b pri" href="${freeUrl}">Read Ch.1 free</a><button class="tp-b" data-act="jump">Unlock</button></div>`
          );
        }
        function sideHTML() {
          return (
            creatorsBox() +
            detailsBox() +
            trailerBox() +
            retailersBox() +
            printBox()
          );
        }

        function refresh() {
          $("tpCover").src = V[S.vol].cover;
          $("tpEps").outerHTML = episodesBox();
          $("tpSide").innerHTML = sideHTML();
        }

        /* ---------------- actions ---------------- */
        function addVol(n) {
          const d = V[n].d;
          chAddDigitalToCart(
            d.key,
            "full",
            "Volume " + n + " - Full Volume",
            d.price,
            V[n].cover,
          );
        }
        const actions = {
          vol(el) {
            S.vol = +el.dataset.n;
            refresh();
          },
          sort() {
            S.asc = !S.asc;
            $("tpEps").outerHTML = episodesBox();
          },
          acc(el) {
            el.closest(".tp-acc").classList.toggle("open");
          },
          addvol(el) {
            addVol(+el.dataset.n);
          },
          addall() {
            buyable.forEach(addVol);
            if (typeof showToast === "function")
              showToast("All volumes added to cart!", "success");
          },
          buych(el) {
            const n = +el.dataset.n,
              i = +el.dataset.i,
              d = V[n].d;
            const id = C.cid + (i + 1),
              label = "Chapter " + (i + 1) + " - " + d.chapters[i];
            if (
              C.chapterMode === "unlock" &&
              typeof initPurchase === "function"
            )
              initPurchase(d.key, id, label, d.cp);
            else chAddDigitalToCart(d.key, id, label, d.cp, V[n].cover);
          },
          jump() {
            document.getElementById("tp").dataset.tab = "eps";
            $("tpUnlock").scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          },
          tab(el) {
            document.getElementById("tp").dataset.tab = el.dataset.t;
            document
              .querySelectorAll(".tp-tabs button")
              .forEach((b) => b.classList.toggle("on", b === el));
            window.scrollTo({
              top: document.querySelector(".tp-tabs").offsetTop - 80,
              behavior: "smooth",
            });
          },
          login() {
            if (typeof openAuth === "function") openAuth("in");
          },
          wish(el) {
            chToggleWishlist(C.id, C.name);
            chUpdateWishlistBtn(C.id, el);
          },
        };
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-act]");
          if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
        });

        /* ---------------- init ---------------- */
        $("tpRoot").innerHTML = page();
        try {
          renderAuthForm("in");
        } catch (e) {}
        try {
          const w = document.querySelector(".tp-wish[data-id]");
          if (w && chIsWishlisted(C.id)) {
            w.classList.add("wishlisted");
            w.innerHTML = HEART_ON;
          }
        } catch (e) {}
        if (localStorage.getItem("ch-theme") === "light")
          document.body.classList.add("light-mode");
        window.toggleTheme = function () {
          const l = document.body.classList.toggle("light-mode");
          localStorage.setItem("ch-theme", l ? "light" : "dark");
        };
        window.addEventListener(
          "scroll",
          function () {
            const b = $("backToTop");
            b.style.display = window.scrollY > 400 ? "flex" : "none";
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
