services:
  - type: web
    name: crossed-hearts-api
    runtime: node
    rootDir: Backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCTION_READINESS_LOCK
        value: "true"
      - key: REQUIRE_READ_TOKEN
        value: "true"
      - key: ADMIN_2FA_REQUIRED
        value: "true"
      - key: ADMIN_IP_ALLOWLIST
        sync: false
      - key: BACKEND_URL
        value: https://crossed-hearts-final.onrender.com
      - key: FRONTEND_URL
        value: https://heartsreader.com,https://www.heartsreader.com,https://crossed-hearts-frontend.onrender.com
      - key: FRONTEND_PUBLIC_URL
        value: https://heartsreader.com
      - key: PAYMENT_ALLOWED_CURRENCIES
        value: usd
      - key: ALLOW_MANUAL_PURCHASE
        value: "false"
      - key: ALLOW_MANUAL_PHYSICAL_ORDERS
        value: "false"
      - key: ALLOW_MANUAL_CAMPAIGN_PLEDGES
        value: "false"
      - key: PHYSICAL_SHIPPING_FEE
        value: "4.99"
      - key: CAMPAIGN_GOAL_AMOUNT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REGISTRATION_ENCRYPTION_SECRET
        sync: false
      - key: LICENSER_JWT_SECRET
        sync: false
      - key: READ_TOKEN_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: TEST_EMAIL_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_INR_PER_USD
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NOTIFY_UPLOAD_SECRET
        sync: false
      - key: PDF_STORAGE_DRIVER
        sync: false
      - key: PDF_STORAGE_PATH
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_REGION
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: ATLAS_BACKUP_ENABLED
        sync: false
      - key: MONGODB_BACKUP_ENABLED
        sync: false

