    <script>

        const st = document.createElement("style");

.tp[data-tab="all"] .tp-tabs{display:none!important}
.tp-pe.bundle img{object-fit:contain}

.tp-pcov{flex:0 0 auto;width:68px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--tp-bg)}
.tp-pcov img{width:100%;height:100%;object-fit:cover;display:block}
.tp-pv .tp-et b{font-size:14px}

@media(max-width:640px){.tp-pbtns .tp-ep-b{flex:1 1 100%;justify-content:center}}`;
        document.head.appendChild(st);

        /* ---- derived config ---- */
        const V = C.vols;
        const N = Object.keys(V)
          .map(Number)
          .sort((a, b) => a - b);
        const mode = C.mode || "both";
        const hasDigital = mode !== "print";
        const hasPrint = mode !== "digital";
        const unit = C.unit || "Chapter";
        const imprint = C.imprint || C.Imprint || "Crossed Hearts";
        const isNovel = /novel/i.test((C.crumb || [])[1] || "");
        const plain = (s) => String(s).replace(/<br\s*\/?>/gi, " ");
        const S = { vol: N[0], asc: true };
        const $ = (id) => document.getElementById(id);
        const usd = (p) =>
          p == null
            ? "TBD"
            : Number.isInteger(p)
              ? "$" + p
              : "$" + p.toFixed(2);
        const q = (s) =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;");
        const dig = N.filter((n) => hasDigital && V[n].d);
        const buyable = dig.filter((n) => V[n].d.buy);
        const allTotal = buyable.reduce((s, n) => s + V[n].d.price, 0);
        const hasCh = dig.some((n) => V[n].d.chapters);
        const freeUrl = dig.map((n) => V[n].d.read).find(Boolean);
        const status = C.status || (hasCh ? "Ongoing" : "Upcoming");
        const chapterMode = C.chapterMode || "unlock";
        const printLink = C.printPage || "print.html?title=" + C.id;

        const HEART =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
        const HEART_ON =
          '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

        /* ---- pieces ---- */
        function unlockBox() {
          if (!buyable.length) return "";
          const cards = buyable
            .map((n) => {
              const v = V[n],
                d = v.d;
              return `<div class="tp-un"><div class="tp-un-t">Volume ${n}</div>
      <div class="tp-un-s">${d.range || "Full volume"}<br>${d.pre ? "Releases " + (v.dd || "TBA") : "Available now"}</div>
      <div class="tp-un-p">${usd(d.price)}</div>
      <button data-act="addvol" data-n="${n}">${d.pre ? "Pre-Order" : "Add to Cart"}</button></div>`;
            })
            .join("");
          const all =
            buyable.length > 1
              ? `<div class="tp-un best"><div class="tp-un-t">Everything</div>
      <div class="tp-un-s">Volumes ${buyable[0]}–${buyable[buyable.length - 1]}<br>The whole series</div>

            hasCh && cp
              ? `<div class="tp-un-note">Or unlock single ${unit.toLowerCase()}s for ${usd(cp)} each in the list below. ${unit} 1 is always free.</div>`

  <div class="tp-un-grid">${cards}${all}</div>${note}</section>`;
        }

        function cadenceBox() {
          const rows = N.map((n) => {
            const v = V[n],
              d = v.d;
            let parts = [];
            if (hasDigital && d && d.chapters && !d.pre)
              parts.push("Digital available now");
            else if (hasDigital && v.dd) parts.push("Digital " + v.dd);
            if (hasPrint && v.pd) parts.push("Print " + v.pd);
            else if (hasPrint && v.p && !v.p.pre)
              parts.push("Print available now");
            return `<div><b>Volume ${n}</b><span>${parts.join(" · ") || "TBA"}</span></div>`;
          }).join("");
          return `<section class="tp-box tp-acc${hasDigital ? "" : " open"}" id="tpCad">
  <button class="tp-row-btn" data-act="acc"><i class="ti ti-speakerphone" aria-hidden="true"></i><span>Release schedule</span><i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
  <div class="tp-acc-b">${rows}</div></section>`;
        }

        function chapterRows(n) {
          const v = V[n],
            d = v.d;
          if (!d) return "";
          if (!d.chapters) {
            const msg = d.buy
              ? d.pre
                ? "Pre-order the full volume now and read it when it releases on " +
                  (v.dd || "the release date") +
                  "."

                  ? "This story is available as a complete standalone digital volume."
                  : "Serialization has not started yet."
              : "The digital edition is coming " +
                (v.dd ? "on " + v.dd : "soon") +
                ".";
            const btn = d.buy
              ? `<button class="tp-b pri" data-act="addvol" data-n="${n}">${d.pre ? "Pre-Order" : "Add to Cart"} · ${usd(d.price)}</button>`

          }
          const idx = d.chapters.map((_, i) => i);
          if (!S.asc) idx.reverse();
          return idx
            .map((i) => {
              const t = d.chapters[i],
                num = i + 1;
              const th = (d.thumbs && d.thumbs[i]) || v.cover;
              if (num === 1)

        <div class="tp-et"><small>${unit} ${num}</small><b>${t}</b><span class="tp-free">Free preview</span></div>
        <div class="tp-ea"><span class="tp-ep-p">Free</span><a class="tp-ep-b rd" href="${d.read}">▶ Read</a></div></div>`;
              return `<div class="tp-ep"><div class="tp-th lock"><img src="${th}" alt="" loading="lazy"><i class="ti ti-lock" aria-hidden="true"></i></div>
      <div class="tp-et"><small>${unit} ${num}</small><b>${t}</b></div>
      <div class="tp-ea"><span class="tp-ep-p">${usd(d.cp)}</span><button class="tp-ep-b" data-act="buych" data-n="${n}" data-i="${i}">${chapterMode === "unlock" ? "Unlock" : "Add"}</button></div></div>`;

        function episodesBox() {
          if (!dig.length) return "";
          const chips = dig
            .map((n) => {

            .join("");
          const d = (V[S.vol] || {}).d || {};
          const count = d.chapters
            ? d.chapters.length + " " + unit.toLowerCase() + "s"

  <div class="tp-vols">${chips}</div>
  <div id="tpEpList">${chapterRows(S.vol)}</div></section>`;
        }

        function detailsBox() {
          const v = V[S.vol];
          const tog = N.map(
            (n) =>
              `<button class="${n === S.vol ? "on" : ""}" data-act="vol" data-n="${n}">Volume ${n}</button>`,

          const kv = (a, b) =>
            `<div class="tp-kv"><span>${a}</span><span>${b}</span></div>`;

            ? v.seeMoreHtml.replace(/class="ch2-sm-row"/g, 'class="tp-kv"')

              kv("Translator", v.translator || "TBD") +
              (C.released != null
                ? kv("Volumes released", C.released + " of " + N.length)
                : "");
          return `<section class="tp-box"><div class="tp-box-h">Details</div><div class="tp-box-b">
  <div class="tp-syn-tabs">${tog}</div>
  <p class="tp-syn">${v.syn || ""}</p>
  ${C.humanTranslated ? '<div class="tp-trust"><i class="ti ti-language" aria-hidden="true"></i><span>100% human-translated — no AI/machine translation used</span></div>' : ""}
  <div class="tp-tags">${(C.chips || []).map((c) => `<span class="tp-tag">${c}</span>`).join("")}</div>

</div></section>`;
        }

            `</section>`

          if (!C.trailer) return "";

        }

        function retailersBox() {
          const L = C.links || {};
          if (!Object.keys(L).length) return "";

            url
              ? `<div class="tp-rt"><span><i class="ti ti-${icon}" aria-hidden="true"></i>${name}</span><a class="tp-get" href="${url}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener"' : ""}>Get</a></div>`
              : `<div class="tp-rt"><span><i class="ti ti-${icon}" aria-hidden="true"></i>${name}</span><span class="tp-sn">Coming soon</span></div>`;

            row("brand-apple", "Apple Books", L.ap) +
            row("device-tablet", "Kobo", L.ko) +
            row("brand-google-play", "Google Play Books", L.gp) +

            `</section>`

              p = v.p;

              : "Available now";
            rows.push(
              `<div class="tp-pe"><img src="${v.cover}" alt="Vol ${n} paperback" loading="lazy"><div><b>Paperback</b>Vol. ${n} · Standard · ${usd(p.std.price)}<br>${when}</div><a class="tp-get" href="${printLink}">View</a></div>`,
            );
            if (p.ltd)
              rows.push(
                `<div class="tp-pe"><img src="${p.ltd.cover || v.cover}" alt="Vol ${n} ${q(p.ltd.name)}" loading="lazy"><div><b>${p.ltd.name}</b>Vol. ${n} · Limited · ${p.ltd.out ? "Sold out" : usd(p.ltd.price)}<br>${when}</div><a class="tp-get" href="${printLink}">View</a></div>`,
              );
          });
          if (C.bundle) {
            const b = C.bundle;
            rows.push(
              `<div class="tp-pe bundle"><img src="${b.cover || V[N[0]].cover}" alt="${q(b.name)}" loading="lazy"><div><b>${b.name}</b>${b.desc} · ${usd(b.price)}<br>${b.pre ? "Pre-order" : "Available now"}</div><a class="tp-get" href="${printLink}">View</a></div>`,
            );
          }
          return rows.length
            ? `<section class="tp-box" id="tpPrint"><div class="tp-box-h">Print editions</div>${rows.join("")}</section>`
            : "";
        }

        /* full-width print list (main column of print-only pages) */
        function printMain() {
          if (hasDigital || !hasPrint) return "";
          const rows = N.filter((n) => V[n].p).map((n) => {
            const v = V[n],
              p = v.p;
            const badge = p.pre
              ? `<span class="tp-pre">Pre-order · ${v.pd || "TBA"}</span>`
              : `<span class="tp-free">Available now</span>`;
            const hasPages = v.pages && v.pages !== "TBD";
            const ltd = p.ltd
              ? p.ltd.out
                ? `<span class="tp-ep-b off">Limited + ${p.ltd.name} · Sold out</span>`
                : `<a class="tp-ep-b rd" href="${printLink}">Limited + ${p.ltd.name} · ${usd(p.ltd.price)}</a>`
              : "";
            return `<div class="tp-ep tp-pv">
      <a class="tp-pcov" href="${printLink}"><img src="${v.cover}" alt="Volume ${n} cover" loading="lazy"></a>
      <div class="tp-et"><small>Volume ${n}${hasPages ? " · " + v.pages + " pages" : ""}</small>
        <b>${plain(C.name)} Vol. ${n}</b>${badge}
        <div class="tp-pbtns">
          <a class="tp-ep-b" href="${printLink}">Standard · ${usd(p.std.price)}</a>${ltd}
        </div></div></div>`;
          });
          if (C.bundle) {
            const b = C.bundle;
            rows.push(`<div class="tp-ep tp-pv">
      <a class="tp-pcov" href="${printLink}"><img src="${b.cover || V[N[0]].cover}" alt="${q(b.name)}" style="object-fit:contain"></a>
      <div class="tp-et"><small>Bundle</small><b>${b.name}</b>
        <span class="tp-pre">${b.pre ? "Pre-order" : "Available now"}</span>
        <div class="tp-pbtns"><a class="tp-ep-b rd" href="${printLink}">${b.desc} · ${usd(b.price)}</a></div></div></div>`);
          }
          if (!rows.length) return "";
          return `<section class="tp-box" id="tpPrint">
    <div class="tp-eh"><h2>${rows.length} print volume${rows.length > 1 ? "s" : ""}</h2></div>
    ${rows.join("")}</section>`;
        }

        function charsSection() {
          const ch = (C.characters || []).filter(
            (c) => c.name && !/^</.test(c.name),
          );
          if (!ch.length) return "";
          return (
            `<section class="tp-chars"><h2>Characters</h2><div class="tp-char-row">` +
            ch
              .map(
                (c) =>
                  `<div class="tp-char"><div class="bg" style="background:${c.accent}"></div>${c.image ? `<img src="${c.image}" alt="${q(c.name)}" loading="lazy">` : ""}<div class="card"><b>${c.name}</b><span>${c.bio}</span></div></div>`,
              )
              .join("") +
            `</div></section>`
          );
        }

        function cta(bar) {
          let h = "";
          if (freeUrl) {
            h += `<a class="tp-b pri" href="${freeUrl}">${bar ? "Read Ch.1 free" : "Read Ch.1 for free"}</a>`;
            if (buyable.length)
              h += `<button class="tp-b" data-act="jump" data-t="tpUnlock">Unlock</button>`;
          } else if (buyable.length) {
            h += `<button class="tp-b pri" data-act="jump" data-t="tpUnlock">${V[buyable[0]].d.pre ? "Pre-Order" : "Unlock"}</button>`;
          }
          if (
            (hasPrint &&
              (!freeUrl || !bar) &&
              document.getElementById("tpPrint") !== null) ||
            (hasPrint && printBox())
          )
            h += `<button class="tp-b${freeUrl || buyable.length ? "" : " pri"}" data-act="jump" data-t="tpPrint">Print editions</button>`;
          return h;
        }

        function head() {
          return `<div class="tp-crumb"><a href="index.html">Home</a><span>›</span><a href="${C.crumb[1]}">${C.crumb[0]}</a><span>›</span><b>${plain(C.name)}</b></div>
  <div class="tp-banner">${C.banner ? `<img src="${C.banner}" alt="" onerror="this.remove()">` : ""}</div>
  <div class="tp-headrow">
    <div class="tp-cover"><img id="tpCover" src="${V[S.vol].cover}" alt="${q(C.name)} cover"><span class="tp-fmt">${!hasDigital ? "Print" : hasPrint ? "Digital + Print" : "Digital"}</span></div>
    <div class="tp-hi">
      <span class="tp-genre">${C.genreLabel || (C.chips || [])[0] || ""}</span>
      <h1>${C.title || C.name}</h1>
      <div class="tp-meta"><span>${isNovel ? "Novel" : "Comic"}</span><span>·</span><span class="ok">● ${status}</span><span>·</span><span>${imprint}</span></div>
      <div class="tp-rate"><span class="st">☆☆☆☆☆</span>No ratings yet · 0 purchases</div>
      <div class="tp-cta">${cta(false)}<button class="tp-wish" id="wl-${C.id}" data-id="${C.id}" data-act="wish" aria-label="Add to wishlist">${HEART}</button></div>
    </div>
  </div>
  <div class="tp-tabs" role="tablist"><button class="on" data-act="tab" data-t="eps">${hasCh ? unit + "s" : "Overview"}</button><button data-act="tab" data-t="info">Info</button></div>`;
        }

        function sideHTML() {
          return (
            creatorsBox() +
            detailsBox() +
            trailerBox() +
            retailersBox() +
            (hasDigital ? printBox() : "")
          );
        }

        function page() {
          return (
            head() +
            `<div class="tp-cols">
  <div class="tp-main">
    <section class="tp-box"><button class="tp-row-btn" data-act="login"><i class="ti ti-lock-open" aria-hidden="true"></i><span>Sign in to keep your purchases in your library</span><i class="ti ti-chevron-right" aria-hidden="true"></i></button></section>
    ${cadenceBox()}${unlockBox()}${episodesBox()}${printMain()}
  </div>
  <aside class="tp-side" id="tpSide">${sideHTML()}</aside>
</div>${charsSection()}
<div class="tp-bar">${cta(true)}</div>`
          );
        }

        function refresh() {
          $("tpCover").src = V[S.vol].cover;
          if ($("tpEps")) $("tpEps").outerHTML = episodesBox();
          $("tpSide").innerHTML = sideHTML();
        }

        /* ---- actions ---- */
        function addVol(n) {
          const d = V[n].d;
          chAddDigitalToCart(
            d.key,
            "full",
            "Volume " + n + " - Full Volume",
            d.price,
            V[n].cover,
          );
        }
        const actions = {
          vol(el) {
            S.vol = +el.dataset.n;
            refresh();
          },
          sort() {
            S.asc = !S.asc;
            $("tpEps").outerHTML = episodesBox();
          },
          acc(el) {
            el.closest(".tp-acc").classList.toggle("open");
          },
          addvol(el) {
            addVol(+el.dataset.n);
          },
          addall() {
            buyable.forEach(addVol);
            if (typeof showToast === "function")
              showToast("All volumes added to cart!", "success");
          },
          buych(el) {
            const n = +el.dataset.n,
              i = +el.dataset.i,
              d = V[n].d;
            const id = (d.cid || "ch") + (i + 1),
              label = unit + " " + (i + 1) + " - " + d.chapters[i];
            if (chapterMode === "unlock" && typeof initPurchase === "function")
              initPurchase(d.key, id, label, d.cp);
            else chAddDigitalToCart(d.key, id, label, d.cp, V[n].cover);
          },
          jump(el) {
            const t = el.dataset.t;
            if (hasDigital)
              $("tp").dataset.tab = t === "tpPrint" ? "info" : "eps";
            const target = $(t);
            if (target)
              target.scrollIntoView({ behavior: "smooth", block: "start" });
          },
          tab(el) {
            $("tp").dataset.tab = el.dataset.t;
            document
              .querySelectorAll(".tp-tabs button")
              .forEach((b) => b.classList.toggle("on", b === el));
            window.scrollTo({
              top: document.querySelector(".tp-tabs").offsetTop - 80,
              behavior: "smooth",
            });
          },
          login() {
            if (typeof openAuth === "function") openAuth("in");
          },
          wish(el) {
            chToggleWishlist(C.id, C.name);
            chUpdateWishlistBtn(C.id, el);
          },
        };
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-act]");
          if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
        });

        /* ---- init ---- */
        const root = $("tpRoot");
        if (!hasDigital) $("tp").dataset.tab = "all";
        root.innerHTML = page();
        try {
          renderAuthForm("in");
        } catch (e) {}
        try {
          const w = document.querySelector(".tp-wish[data-id]");
          if (w && chIsWishlisted(C.id)) {
            w.classList.add("wishlisted");
            w.innerHTML = HEART_ON;
          }
        } catch (e) {}
        if (localStorage.getItem("ch-theme") === "light")
          document.body.classList.add("light-mode");
        window.toggleTheme = function () {
          const l = document.body.classList.toggle("light-mode");
          localStorage.setItem("ch-theme", l ? "light" : "dark");
        };
        window.addEventListener(
          "scroll",
          function () {
            const b = $("backToTop");
            if (b) b.style.display = window.scrollY > 400 ? "flex" : "none";
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
